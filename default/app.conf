# Splunk app for the Lowland Parcel Co. project.
# The app id is the folder name under etc/apps. A lab started from lab/templates/dev can
# rename it (APP_NAME); a lab created by the lab manager always uses lowland_parcel.

[install]
is_configured = true

[package]
id = lowland_parcel
check_for_updates = false

[ui]
is_visible = true
label = Lowland Parcel Co.

[launcher]
author = DataGoLive player
description = Data onboarding and dashboards for Lowland Parcel Co.
version = 0.1.0

# The scanner log folder, one monitor per depot. Splunk gives each file the source type of its
# depot's format at the door (inputs.conf says WHAT to read and how to LABEL it; props.conf
# says how to READ each label).
#
# JSON with UTC times: Rotterdam, Utrecht, Antwerp
# JSON with local times: Eindhoven
# plain text with local times: Ghent, Liege
#
# crcSalt = <SOURCE>: Splunk remembers the files it has read by a checksum of their first
# bytes. Adding the salt makes every checksum new, so the files already read on day 2 (with
# the wrong source type) are read again. Keep it: taking it out would read them all again.

[monitor:///var/lib/dgl/scanner/DEP01-*.log]
index = lowland_scans
sourcetype = lowland:scan:json_utc
crcSalt = <SOURCE>

[monitor:///var/lib/dgl/scanner/DEP02-*.log]
index = lowland_scans
sourcetype = lowland:scan:json_utc
crcSalt = <SOURCE>

[monitor:///var/lib/dgl/scanner/DEP03-*.log]
index = lowland_scans
sourcetype = lowland:scan:json_local
crcSalt = <SOURCE>

[monitor:///var/lib/dgl/scanner/DEP04-*.log]
index = lowland_scans
sourcetype = lowland:scan:json_utc
crcSalt = <SOURCE>

[monitor:///var/lib/dgl/scanner/DEP05-*.log]
index = lowland_scans
sourcetype = lowland:scan:text
crcSalt = <SOURCE>

[monitor:///var/lib/dgl/scanner/DEP06-*.log]
index = lowland_scans
sourcetype = lowland:scan:text
crcSalt = <SOURCE>

# How Splunk reads each kind of scanner log.
#
# INDEX TIME (applied once, while the data is indexed; only data indexed after the change
# is affected): SHOULD_LINEMERGE, LINE_BREAKER, TIME_PREFIX, TIME_FORMAT,
# MAX_TIMESTAMP_LOOKAHEAD, TZ.
# SEARCH TIME (applied every time you search; changes apply to everything already indexed):
# KV_MODE, EXTRACT-.

# JSON lines, time in UTC: {"ts":"2026-03-02T04:34:22.710Z","scanner":...}
[lowland:scan:json_utc]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "ts":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 30
TZ = UTC
KV_MODE = json

# JSON lines, local time without a zone: {"ts":"2026-03-02 05:35:46.121","scanner":...}
# Eindhoven is in the Netherlands: Europe/Amsterdam (UTC+1 in March, UTC+2 in summer).
[lowland:scan:json_local]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "ts":"
TIME_FORMAT = %Y-%m-%d %H:%M:%S.%3N
MAX_TIMESTAMP_LOOKAHEAD = 30
TZ = Europe/Amsterdam
KV_MODE = json

# Plain text, local time without a zone:
#   2026-03-02 05:36:44,873 DEP05-S06 ARRIVED parcel=LP0010500121 depot=DEP05 service=EXPRESS
# A line can also have no timestamp at all (an event of its own: Splunk gives it the time of
# the line before), and a firmware fault is one event of five lines (the ERROR line and its
# stack trace). So a new event starts at a line that begins with a date or with a scanner name.
# Ghent and Liege are in Belgium: Europe/Brussels (the same hours as Amsterdam).
# The "|$" at the end of LINE_BREAKER lets the last line of a file end its event: without it the final
# newline of the file stays attached to the last event, which then counts as two lines.
[lowland:scan:text]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=(?:\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} |DEP\d{2}-S\d{2} )|$)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N
MAX_TIMESTAMP_LOOKAHEAD = 25
TZ = Europe/Brussels
EXTRACT-scan = (?<scanner>DEP\d{2}-S\d{2})\s+(?<event>[A-Z]+)(?:\s+parcel=(?<parcel>\S+))?(?:\s+depot=(?<depot>\S+))?(?:\s+service=(?<service>\S+))?
